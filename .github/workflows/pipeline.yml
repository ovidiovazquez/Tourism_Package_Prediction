name: Tourism Package Prediction MLOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "data/tourism.csv"
      - "model_building/**"
      - "requirements.txt"
      - "requirements-training.txt"
      - ".github/workflows/pipeline.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-mlops-main
  cancel-in-progress: false

jobs:
  mlops-pipeline:
    name: Data Preparation, Training and Deployment
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-training.txt

      - name: Validate source dataset
        run: |
          test -f data/tourism.csv
          test -f model_building/data_preparation.py
          test -f model_building/model_training.py

      - name: Run data preparation
        run: |
          python model_building/data_preparation.py

      - name: Verify prepared datasets
        run: |
          python -c "import pandas as pd; train=pd.read_csv('data/train.csv'); test=pd.read_csv('data/test.csv'); assert len(train)>0 and len(test)>0; assert list(train.columns)==list(test.columns); assert 'ProdTaken' in train.columns; print('Prepared datasets verified:',train.shape,test.shape)"

      - name: Run model training and experiment tracking
        run: |
          python model_building/model_training.py

      - name: Validate trained model and deployment files
        run: |
          python -c "from pathlib import Path; files=['models/tourism_random_forest_pipeline.joblib','models/model_schema.json','outputs/model_metrics.json','outputs/random_forest_cv_results.csv','mlflow/mlflow.db','app.py','requirements.txt']; missing=[f for f in files if not Path(f).is_file() or Path(f).stat().st_size==0]; assert not missing, f'Missing or empty artifacts: {missing}'; print('All generated artifacts verified')"

      - name: Preserve MLflow experiment tracking
        uses: actions/upload-artifact@v4
        with:
          name: tourism-mlflow-experiments
          path: mlflow/
          retention-days: 30
          if-no-files-found: error

      - name: Preserve model and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tourism-model-results
          path: |
            models/tourism_random_forest_pipeline.joblib
            models/model_schema.json
            outputs/model_metrics.json
            outputs/random_forest_cv_results.csv
          retention-days: 30
          if-no-files-found: error

      - name: Commit and push updated model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/train.csv data/test.csv
          git add models/tourism_random_forest_pipeline.joblib
          git add models/model_schema.json
          git add outputs/model_metrics.json
          git add outputs/random_forest_cv_results.csv

          if git diff --cached --quiet; then
            echo "No generated file changes to commit."
          else
            git commit -m "Update automated tourism ML pipeline artifacts [skip ci]"
            git push origin HEAD:main
          fi

      - name: Pipeline completed
        run: |
          echo "Tourism MLOps pipeline completed successfully."
          echo "Generated model and results are available in GitHub."
